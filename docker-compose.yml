version: '3'
services:
  quiz-app:
    container_name: quiz-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8082:8080"
    # Эти свойства перегружают соответствующие в application.yml
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/quiz_app
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SERVER_PORT=8080
      - UPLOAD_PATH_IMG=/app/uploads
      - UPLOAD_PATH_IMGPREFIX=
    volumes:
      - pg_backups:/var/backups
      - uploads:/app/uploads
  postgres:
    container_name: postgres
    image: "postgres:14"
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quiz_app
    volumes:
      - pg_backups:/var/backups
      - pg_data:/var/lib/postgresql/data
  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"

volumes:
  pg_backups:
  pg_data:
  uploads: